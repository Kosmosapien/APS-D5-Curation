<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APS294 | SwinIR review</title><style>body{font-family:system-ui;background:#10141d;color:#e9edf5;margin:0;padding:16px}header{position:sticky;top:0;background:#10141df2;padding:10px 0;z-index:3}h1{font-size:22px;margin:0}p{color:#b6c2d1}section{border:1px solid #374151;border-radius:12px;margin:16px 0;padding:12px}h2{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(min-width:850px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}figure{margin:0}img{width:100%;border-radius:7px}figcaption{font-size:12px;text-align:center;margin:5px}button{padding:11px;border:1px solid #6b7280;border-radius:8px;background:#222b3a;color:white;margin:5px 4px 5px 0}.active{background:#2563eb}small{color:#9ca3af}</style><header><h1>APS294 — revisão SwinIR</h1><p>Comparação: fonte, baseline, teacher, APS293 e APS294. 40 imagens usadas no treino APS294; amostra de revisão. Nenhuma selfie real publicada.</p><button id="export">Exportar avaliações JSON</button><small id="counter"></small></header><main id="app"></main><script>const keys=['source','baseline','teacher','aps293','aps294'],labels=['Fonte','Baseline','Teacher LoRA32','SwinIR APS293','SwinIR APS294'];const decisions=JSON.parse(localStorage.getItem('aps294_reviews')||'{}');fetch('cases.json').then(x=>x.json()).then(rows=>{const root=document.getElementById('app');rows.forEach(r=>{const s=document.createElement('section');const title=document.createElement('h2');title.textContent=r.id+(r.was_validation?' · antes validação, agora treino':'');s.append(title);const grid=document.createElement('div');grid.className='grid';keys.forEach((k,i)=>{if(k==='aps293'&&!r.has_aps293)return;const f=document.createElement('figure');const im=document.createElement('img');im.loading='lazy';im.src=r.id+'_'+k+'.jpg';im.alt=labels[i];im.onclick=()=>window.open(im.src,'_blank');const cap=document.createElement('figcaption');cap.textContent=labels[i];f.append(im,cap);grid.append(f)});s.append(grid);['APS294 melhor','APS293 melhor','Empate','Ambos ruins'].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{decisions[r.id]=v;localStorage.setItem('aps294_reviews',JSON.stringify(decisions));update()};b.dataset.id=r.id;b.dataset.value=v;s.append(b)});root.append(s)});update()});function update(){document.getElementById('counter').textContent='Avaliações: '+Object.keys(decisions).length;document.querySelectorAll('button[data-id]').forEach(b=>b.classList.toggle('active',decisions[b.dataset.id]===b.dataset.value))}document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({experiment:'APS294',reviews:decisions},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aps294_reviews.json';a.click();URL.revokeObjectURL(a.href)};</script></html>
